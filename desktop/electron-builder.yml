appId: com.traceability.desktop
productName: Traceability
directories:
  output: dist
files:
  - main.js
extraResources:
  - from: build-input
    to: app
win:
  target:
    - target: portable
      arch: [x64]
mac:
  target:
    - target: zip
      arch: [x64, arm64]
linux:
  target:
    - AppImage
